<!DOCTYPE html>
<html>
<head>
    <title>Claude Prompt App</title>
    <style>
        body { font-family: Arial; margin: 2em; }
        textarea { width: 100%; height: 150px; }
        .output { margin-top: 1em; padding: 1em; background: #f9f9f9; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>Ask Claude</h1>
    <form method="POST">
        <textarea name="prompt" placeholder="Enter your prompt here..."></textarea><br><br>
        <button type="submit">Send</button>
    </form>

    {% if response %}
    <div class="output">
        <h3>Claude's Response:</h3>
        {{ response | safe }}
    </div>
    {% endif %}
</body>
</html>
